name: LookML PR Checks

on:
  pull_request:
    paths:
      - "**/*.lkml"
      - "**/*.lookml"
      - "**/*.snap.json.md"
      - "**/*.snap.strings.json"
      - "**/*.snap.json"
      - "**/data.json"
      - "**/input.sql"
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

concurrency:
  group: looker-dev-${{ vars.LOOKER_PROJECT_NAME || github.repository }}
  cancel-in-progress: false

env:
  BASE_REF: ${{ github.base_ref || github.event.pull_request.base.ref }}
  BRANCH_NAME: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref_name }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  snapshots:
    name: LookML Snapshots (Additive vs Breaking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: Locate LookML files
        id: check
        run: |
          LOOKML_DIR=$(find ./data -mindepth 2 -maxdepth 2 -type d -name "lookml" 2>/dev/null | head -n 1 || true)
          LOOKML_DIR="${LOOKML_DIR:-.}"
          if ! find "$LOOKML_DIR" -name "*.lkml" 2>/dev/null | grep -q .; then
            echo "has_lookml=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'has_lookml=true\nlookml_dir=%s\n' "$LOOKML_DIR" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v7
        if: steps.check.outputs.has_lookml == 'true'

      - name: Install lkr-dev-cli
        if: steps.check.outputs.has_lookml == 'true'
        run: |
          uv tool install "lkr-dev-cli[parse]"
          if ! lkr parse lookml snapshot --help 2>&1 | grep -q -- "--allow-additions"; then
            uv tool install --force "lkr-dev-cli[parse] @ git+https://github.com/lkrdev/cli.git"
          fi

      - name: Check LookML Snapshots (Additive vs Material Changes)
        if: steps.check.outputs.has_lookml == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKML_DIR: ${{ steps.check.outputs.lookml_dir }}
          LOOKML_REVIEWERS: ${{ vars.LOOKML_REVIEWERS }}
        run: |
          lkr parse lookml-to-api --path "$LOOKML_DIR" --validate >/dev/null

          BASE_ARGS=()
          if [[ -n "$BASE_REF" ]] && git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            rm -rf /tmp/base-branch
            git worktree add --detach /tmp/base-branch "origin/$BASE_REF"
            if [[ -d "/tmp/base-branch/${LOOKML_DIR#./}" ]] && find "/tmp/base-branch/${LOOKML_DIR#./}" \( -name "*.lkml" -o -name "*.snap.json.md" -o -name "*.snap.strings.json" -o -name "*.snap.json" \) 2>/dev/null | grep -q .; then
              BASE_ARGS=(--base-path "/tmp/base-branch/${LOOKML_DIR#./}")
            elif find "/tmp/base-branch" \( -name "*.lkml" -o -name "*.snap.json.md" -o -name "*.snap.strings.json" -o -name "*.snap.json" \) 2>/dev/null | grep -q .; then
              BASE_ARGS=(--base-path "/tmp/base-branch")
            fi
          fi

          lkr parse lookml snapshot --path "$LOOKML_DIR" "${BASE_ARGS[@]}" --allow-additions --format json --output /tmp/snapshot_check.json || true
          if [[ ! -f /tmp/snapshot_check.json ]]; then
            echo "::error::Failed to generate /tmp/snapshot_check.json via lkr parse lookml snapshot."
            exit 1
          fi
          cat /tmp/snapshot_check.json

          if jq -e '.requires_review == false' /tmp/snapshot_check.json >/dev/null; then
            echo "Snapshot check passed: changes are purely additive (no material changes requiring review)."
            exit 0
          fi

          CODEOWNERS_REQ=$(jq -r '.required_reviewers // [] | join(",")' /tmp/snapshot_check.json)
          ALL_REVIEWERS=$(jq -r '[.required_reviewers[]?, (env.LOOKML_REVIEWERS // "" | split(",")[] | select(length > 0))] | unique | join(",")' /tmp/snapshot_check.json)
          {
            echo "### Material LookML Snapshot Changes (Human Review Required)"
            echo ""
            jq -r '.material_changes[]? | "- `" + . + "`"' /tmp/snapshot_check.json
            if [[ -n "$CODEOWNERS_REQ" ]]; then
              echo ""
              echo "Required CODEOWNERS: \`$CODEOWNERS_REQ\`"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [[ -n "$PR_NUMBER" ]]; then
            [[ -n "$ALL_REVIEWERS" ]] && gh pr edit "$PR_NUMBER" --add-reviewer "$ALL_REVIEWERS" >/dev/null 2>&1 || true
            PR_REVIEWS=$(gh pr view "$PR_NUMBER" --json reviewDecision,latestReviews 2>/dev/null || echo "{}")
            REQ_JSON=$(jq -c '.required_reviewers // []' /tmp/snapshot_check.json)
            if echo "$PR_REVIEWS" | jq -e --argjson req "$REQ_JSON" '
              ([.latestReviews[]? | select(.state == "APPROVED") | .author.login | ascii_downcase]) as $approved
              | ($req | map(ascii_downcase)) as $required
              | ($required | map(select((contains("/") or contains("@")) | not))) as $req_users
              | (.reviewDecision != "CHANGES_REQUESTED") and (
                  if ($req_users | length) > 0 then
                    ($req_users | all(. as $u | ($approved | index($u)) != null)) and (
                      (($required | length) == ($req_users | length)) or (.reviewDecision == "APPROVED")
                    )
                  else
                    .reviewDecision == "APPROVED" or (($approved | length) > 0 and ($required | length) == 0)
                  end
                )
            ' >/dev/null 2>&1; then
              echo "Material LookML changes detected and approved by required CODEOWNERS / human reviewer."
              exit 0
            fi
          fi

          echo "::error::Material LookML snapshot changes detected (modified or removed assert, test field, connection, measure label, access control, or manifest). Approval from required CODEOWNERS (${CODEOWNERS_REQ:-human reviewer}) is required."
          exit 1

  validator:
    name: LookML Project Validator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_lookml: ${{ steps.check.outputs.has_lookml }}
    steps:
      - uses: actions/checkout@v5

      - name: Locate LookML files
        id: check
        run: |
          LOOKML_DIR=$(find ./data -mindepth 2 -maxdepth 2 -type d -name "lookml" 2>/dev/null | head -n 1 || true)
          if find "${LOOKML_DIR:-.}" -name "*.lkml" 2>/dev/null | grep -q .; then
            echo "has_lookml=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lookml=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v7
        if: steps.check.outputs.has_lookml == 'true'

      - name: Install lkr-dev-cli
        if: steps.check.outputs.has_lookml == 'true'
        run: uv tool install "lkr-dev-cli[tools,code-mode]"

      - name: Authenticate Looker API
        if: steps.check.outputs.has_lookml == 'true'
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
          LOOKERSDK_CLIENT_ID: ${{ secrets.LOOKERSDK_CLIENT_ID }}
          LOOKERSDK_CLIENT_SECRET: ${{ secrets.LOOKERSDK_CLIENT_SECRET }}
        run: lkr --base-url="$LOOKERSDK_BASE_URL" --client-id="$LOOKERSDK_CLIENT_ID" --client-secret="$LOOKERSDK_CLIENT_SECRET" --dev auth add-access-token

      - name: Run LookML Validator
        if: steps.check.outputs.has_lookml == 'true'
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
          PROJECT_ID: ${{ secrets.LOOKER_PROJECT_NAME || vars.LOOKER_PROJECT_NAME }}
        run: |
          SCRIPT_DIR=".agents/skills/agentic-lookml-workflow/scripts"
          [[ ! -d "$SCRIPT_DIR" ]] && SCRIPT_DIR="skills/agentic-lookml-workflow/scripts"
          OUT=$(lkr --base-url="$LOOKERSDK_BASE_URL" --dev code-mode sandbox \
            --file="$SCRIPT_DIR/validate_and_commit_branch.py" \
            --var project_id="$PROJECT_ID" \
            --var branch_name="$BRANCH_NAME" \
            --var skip_tests="true")
          echo "$OUT"
          echo "$OUT" | sed -n '/^{/,$p' | jq -e '.passed == true' >/dev/null

  data-tests:
    name: LookML Data Tests
    needs: [validator]
    if: needs.validator.outputs.has_lookml == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install lkr-dev-cli
        run: uv tool install "lkr-dev-cli[tools,code-mode]"

      - name: Authenticate Looker API
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
          LOOKERSDK_CLIENT_ID: ${{ secrets.LOOKERSDK_CLIENT_ID }}
          LOOKERSDK_CLIENT_SECRET: ${{ secrets.LOOKERSDK_CLIENT_SECRET }}
        run: lkr --base-url="$LOOKERSDK_BASE_URL" --client-id="$LOOKERSDK_CLIENT_ID" --client-secret="$LOOKERSDK_CLIENT_SECRET" --dev auth add-access-token

      - name: Run LookML Data Tests
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
          PROJECT_ID: ${{ secrets.LOOKER_PROJECT_NAME || vars.LOOKER_PROJECT_NAME }}
        run: |
          SCRIPT_DIR=".agents/skills/agentic-lookml-workflow/scripts"
          [[ ! -d "$SCRIPT_DIR" ]] && SCRIPT_DIR="skills/agentic-lookml-workflow/scripts"
          OUT=$(lkr --base-url="$LOOKERSDK_BASE_URL" --dev code-mode sandbox \
            --file="$SCRIPT_DIR/validate_and_commit_branch.py" \
            --var project_id="$PROJECT_ID" \
            --var branch_name="$BRANCH_NAME" \
            --var head_sha="$HEAD_SHA" \
            --var skip_validate="true")
          echo "$OUT"
          echo "$OUT" | sed -n '/^{/,$p' | jq -e '.passed == true' >/dev/null

  query-parity:
    name: SQL-to-LookML Query Parity Gate
    needs: [validator]
    if: needs.validator.outputs.has_lookml == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5

      - name: Resolve Query Parity Payload
        id: payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA_FILE=$(find ./data -name "data.json" 2>/dev/null | head -n 1 || true)
          if [[ -n "$DATA_FILE" && -f "$DATA_FILE" ]]; then
            cp "$DATA_FILE" /tmp/data_payload.json
          elif [[ -n "$PR_NUMBER" ]]; then
            PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body' 2>/dev/null || true)
            DATA_PAYLOAD=$(echo "$PR_BODY" \
              | awk '/<summary><code>data\.json<\/code><\/summary>/{flag=1; next} flag && /^```json/{in_json=1; next} in_json && /^```/{exit} in_json{print}' || true)
            if [[ -z "$DATA_PAYLOAD" ]]; then
              GIST_ID=$(echo "$PR_BODY" | grep -Eo 'https://gist\.github\.com/[^[:space:])]+/[0-9a-f]+' | head -n 1 | awk -F'/' '{print $NF}' || true)
              if [[ -n "$GIST_ID" ]]; then
                DATA_PAYLOAD=$(gh api "gists/$GIST_ID" | jq -r '.files["data.json"].content // empty' || true)
              fi
            fi
            [[ -n "$DATA_PAYLOAD" ]] && printf '%s' "$DATA_PAYLOAD" > /tmp/data_payload.json
          fi
          if [[ ! -s /tmp/data_payload.json ]]; then
            echo "No data.json session payload found on disk or in PR description, skipping query parity check."
            echo "has_payload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_payload=true" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v7
        if: steps.payload.outputs.has_payload == 'true'

      - name: Install lkr-dev-cli
        if: steps.payload.outputs.has_payload == 'true'
        run: uv tool install "lkr-dev-cli[tools,code-mode]"

      - name: Authenticate Looker API
        if: steps.payload.outputs.has_payload == 'true'
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
          LOOKERSDK_CLIENT_ID: ${{ secrets.LOOKERSDK_CLIENT_ID }}
          LOOKERSDK_CLIENT_SECRET: ${{ secrets.LOOKERSDK_CLIENT_SECRET }}
        run: lkr --base-url="$LOOKERSDK_BASE_URL" --client-id="$LOOKERSDK_CLIENT_ID" --client-secret="$LOOKERSDK_CLIENT_SECRET" --dev auth add-access-token

      - name: Verify Query Parity (SQL Runner vs Looker Inline Query)
        if: steps.payload.outputs.has_payload == 'true'
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
          PROJECT_ID: ${{ secrets.LOOKER_PROJECT_NAME || vars.LOOKER_PROJECT_NAME }}
        run: |
          SCRIPT_DIR=".agents/skills/agentic-lookml-workflow/scripts"
          [[ ! -d "$SCRIPT_DIR" ]] && SCRIPT_DIR="skills/agentic-lookml-workflow/scripts"
          lkr --base-url="$LOOKERSDK_BASE_URL" --dev code-mode sandbox \
            --file="$SCRIPT_DIR/validate_and_commit_branch.py" \
            --var project_id="$PROJECT_ID" \
            --var branch_name="$BRANCH_NAME" \
            --var head_sha="$HEAD_SHA" \
            --var skip_validate="true" \
            --var skip_tests="true" >/dev/null
          OUT=$(lkr --base-url="$LOOKERSDK_BASE_URL" --dev code-mode sandbox \
            --file="$SCRIPT_DIR/pre_gate.py" \
            --var data_json="$(cat /tmp/data_payload.json)")
          echo "$OUT"
          echo "$OUT" | sed -n '/^{/,$p' | jq -e '.passed == true' >/dev/null
