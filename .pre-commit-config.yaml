repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.12
    hooks:
      - id: uv-lock
        args: ["--default-index", "https://pypi.org/simple", "--no-config"]
  - repo: local
    hooks:
      - id: docs
        name: generate cli docs
        entry: bash -c "make docs && git add lkr.md"
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: test-and-coverage
        name: pytest & rust coverage
        entry: make coverage
        language: system
        pass_filenames: false
