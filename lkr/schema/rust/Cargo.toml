[package]
name = "lkr_schema_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "_schema_rs"
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py312"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
