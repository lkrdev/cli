name: LookML PR Checks

on:
  pull_request:
    paths:
      - "**/*.lkml"
      - "**/*.lookml"
      - "**/data.json"
      - "**/input.sql"
  workflow_dispatch:

jobs:
  lookml-validator:
    name: LookML Validator & Data Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Install lkr-dev-cli
        run: |
          uv tool install "lkr-dev-cli[tools,code-mode,parse]"

      - name: Authenticate Looker API
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
          LOOKERSDK_CLIENT_ID: ${{ secrets.LOOKERSDK_CLIENT_ID }}
          LOOKERSDK_CLIENT_SECRET: ${{ secrets.LOOKERSDK_CLIENT_SECRET }}
        run: |
          lkr --base-url="$LOOKERSDK_BASE_URL" --client-id="$LOOKERSDK_CLIENT_ID" --client-secret="$LOOKERSDK_CLIENT_SECRET" --dev auth add-access-token

      - name: Run LookML Validator & Data Tests
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
          PROJECT_ID: ${{ secrets.LOOKER_PROJECT_NAME || vars.LOOKER_PROJECT_NAME }}
        run: |
          lkr --base-url="$LOOKERSDK_BASE_URL" --dev code-mode sandbox --dev-mode \
            --file=skills/agentic-lookml-workflow/scripts/verify_lookml_validation.py \
            --var project_id="$PROJECT_ID"

  sql-lookml-parity:
    name: SQL-to-LookML Parity Check
    needs: [lookml-validator]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Install lkr-dev-cli
        run: |
          uv tool install "lkr-dev-cli[tools,code-mode,parse]"

      - name: Authenticate Looker API
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
          LOOKERSDK_CLIENT_ID: ${{ secrets.LOOKERSDK_CLIENT_ID }}
          LOOKERSDK_CLIENT_SECRET: ${{ secrets.LOOKERSDK_CLIENT_SECRET }}
        run: |
          lkr --base-url="$LOOKERSDK_BASE_URL" --client-id="$LOOKERSDK_CLIENT_ID" --client-secret="$LOOKERSDK_CLIENT_SECRET" --dev auth add-access-token

      - name: Verify Query Parity (SQL Runner vs Looker Inline Query)
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
        run: |
          DATA_FILE=$(find ./data -name "data.json" | head -n 1)
          if [[ -z "$DATA_FILE" ]]; then
            echo "No data.json session file found, skipping query parity check."
            exit 0
          fi
          lkr --base-url="$LOOKERSDK_BASE_URL" --dev code-mode sandbox --dev-mode \
            --file=skills/agentic-lookml-workflow/scripts/verify_sql_lookml_parity.py \
            --var data_json_path="$DATA_FILE"
