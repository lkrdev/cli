name: Update Looker Skills

on:
  schedule:
    # Runs weekly every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update installed skills and check for new LookML skills
        id: sync_skills
        run: |
          set -euo pipefail

          # 1. Stage sub-skills into .agents/skills/ so npx skills update can sync them
          if compgen -G "skills/lookml/sub-skills/lookml-*" > /dev/null; then
            mv skills/lookml/sub-skills/lookml-* .agents/skills/
          fi

          npx --yes skills update -p -y

          # 2. Check upstream looker-open-source/looker-skills for any new lookml-* writing skills
          UPSTREAM_DIR=$(mktemp -d)
          git clone --depth 1 https://github.com/looker-open-source/looker-skills.git "$UPSTREAM_DIR"

          EXCLUDED_SKILLS="lookml-modeling-guidelines lookml-reviewer"
          NEW_LOOKML_SKILLS=()

          for skill_dir in "$UPSTREAM_DIR"/skills/lookml-*; do
            [ -d "$skill_dir" ] || continue
            skill_name=$(basename "$skill_dir")
            if [[ " $EXCLUDED_SKILLS " == *" $skill_name "* ]]; then
              continue
            fi
            if [ ! -d ".agents/skills/$skill_name" ]; then
              NEW_LOOKML_SKILLS+=("$skill_name")
            fi
          done

          rm -rf "$UPSTREAM_DIR"

          if [ ${#NEW_LOOKML_SKILLS[@]} -gt 0 ]; then
            echo "Installing new LookML skills: ${NEW_LOOKML_SKILLS[*]}"
            npx --yes skills add looker-open-source/looker-skills \
              --agent antigravity \
              --skill "${NEW_LOOKML_SKILLS[@]}" \
              -y
          fi

          # 3. Check upstream lkrdev/ojof-gym for any new *ojof* LookML skills
          OJOF_DIR=$(mktemp -d)
          git clone --depth 1 https://github.com/lkrdev/ojof-gym.git "$OJOF_DIR"
          NEW_OJOF_SKILLS=()

          while IFS= read -r skill_md; do
            skill_dir=$(dirname "$skill_md")
            skill_name=$(basename "$skill_dir")
            if [[ "$skill_name" == *ojof* ]] && [ ! -d ".agents/skills/$skill_name" ]; then
              NEW_OJOF_SKILLS+=("$skill_name")
            fi
          done < <(find "$OJOF_DIR" -name "SKILL.md")

          rm -rf "$OJOF_DIR"

          if [ ${#NEW_OJOF_SKILLS[@]} -gt 0 ]; then
            echo "Installing new OJOF skills: ${NEW_OJOF_SKILLS[*]}"
            npx --yes skills add lkrdev/ojof-gym \
              --agent antigravity \
              --skill "${NEW_OJOF_SKILLS[@]}" \
              -y
          fi

          ALL_NEW_SKILLS=("${NEW_LOOKML_SKILLS[@]}" "${NEW_OJOF_SKILLS[@]}")
          if [ ${#ALL_NEW_SKILLS[@]} -gt 0 ]; then
            echo "new_skills=${ALL_NEW_SKILLS[*]}" >> "$GITHUB_OUTPUT"
          else
            echo "new_skills=" >> "$GITHUB_OUTPUT"
          fi

          # 4. Return all lookml-* skills to skills/lookml/sub-skills/ (.agents/skills/lookml/sub-skills/)
          mkdir -p skills/lookml/sub-skills
          mv .agents/skills/lookml-* skills/lookml/sub-skills/

      - name: Create or Update Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_SKILLS: ${{ steps.sync_skills.outputs.new_skills }}
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No skill changes detected."
            exit 0
          fi

          BRANCH="chore/update-looker-skills"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add skills/lookml/sub-skills skills-lock.json
          git commit -m "chore(skills): update looker-open-source/looker-skills and lkrdev/ojof-gym"
          git push --force origin "$BRANCH"

          BODY="Automated weekly sync of LookML writing skills from [\`looker-open-source/looker-skills\`](https://github.com/looker-open-source/looker-skills) and [\`lkrdev/ojof-gym\`](https://github.com/lkrdev/ojof-gym) via \`npx skills\`.

          - Updates existing skills tracked in \`skills-lock.json\` and \`.agents/skills/lookml/sub-skills/*\`.
          - Newly discovered \`lookml-*\` skills installed: \`${NEW_SKILLS:-none}\`

          If new \`lookml-*\` skills were added, consider adding them to \`skills/lookml/SKILL.md\` and \`skills/agentic-lookml/SKILL.md\`."

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "chore(skills): weekly looker-skills sync" --body "$BODY"
          else
            gh pr create --head "$BRANCH" --title "chore(skills): weekly looker-skills sync" --body "$BODY"
          fi
