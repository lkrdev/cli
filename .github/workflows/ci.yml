name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Install dependencies
        run: |
          uv sync --extra all

      - name: Run Rust clippy, unit tests, and build extension
        run: |
          cargo clippy --manifest-path lkr/schema/rust/Cargo.toml -- -D warnings
          cargo test --no-default-features --manifest-path lkr/schema/rust/Cargo.toml
          make schema-rs

      - name: Run pytest
        run: |
          uv run pytest tests/ -v
          uv run pytest tests/test_schema.py -v --cov=lkr.schema --cov=scripts.schema --cov-report=term-missing

      - name: Run ruff
        run: |
          uv run ruff check .

      - name: Run ty
        run: |
          uv run ty check

  validate-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --extra all

      - name: Run pytest
        run: uv run pytest tests/ -v

      - name: Smoke test packaged wheel in PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          uv build --wheel --out-dir $dist

          $work = Join-Path $env:RUNNER_TEMP "lkr-smoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Set-Location $work

          $ver = (uvx --find-links $dist --from "lkr-dev-cli[all]==0.0.0" lkr --version | Out-String).Trim()
          if ($ver -ne "0.0.0") { throw "Expected wheel version 0.0.0, got '$ver'" }

          $env:UV_TOOL_DIR = Join-Path $work "tools"
          $env:UV_TOOL_BIN_DIR = Join-Path $work "bin"
          uv tool install --find-links $dist "lkr-dev-cli[all]==0.0.0"
          $lkr = Join-Path $env:UV_TOOL_BIN_DIR "lkr.exe"

          & $lkr --help
          & $lkr parse sql --sql "SELECT id, count(*) AS c FROM orders GROUP BY 1"
          & $lkr parse lookml --lookml "view: orders { dimension: id { primary_key: yes } }"
          & $lkr code-mode type WriteQuery
          '{"name":"orders","fields":{"dimensions":[{"name":"orders.id","type":"number"}],"measures":[{"name":"orders.count","type":"count"}]}}' | Set-Content -Path explore.json -Encoding utf8NoBOM
          '{"model":"shop","view":"orders","fields":["orders.id","orders.count"]}' | Set-Content -Path query.json -Encoding utf8NoBOM
          & $lkr schema validate -m shop -e orders -f explore.json --query-file query.json
