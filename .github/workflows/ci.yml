name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: latest

      - name: Install dependencies
        run: |
          uv sync --extra all

      - name: Run Rust clippy, unit tests, and build extension
        run: |
          cargo clippy --manifest-path lkr/schema/rust/Cargo.toml -- -D warnings
          cargo test --no-default-features --manifest-path lkr/schema/rust/Cargo.toml
          make schema-rs

      - name: Run pytest with coverage
        run: |
          uv run pytest tests/ -v --cov=lkr.schema --cov=scripts.schema --cov-report=term-missing

      - name: Run ruff
        run: |
          uv run ruff check .

      - name: Run ty
        run: |
          uv run ty check
