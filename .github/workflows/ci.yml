name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: "write"
      pull-requests: "write"
      id-token: "write"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          curl -fSL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C ~/.cargo/bin --strip-components=1 wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Install dependencies
        run: |
          uv sync --extra all

      - name: Run Rust clippy, unit tests, and build extension
        run: |
          cargo clippy --manifest-path lkr/schema/rust/Cargo.toml -- -D warnings
          cargo test --no-default-features --manifest-path lkr/schema/rust/Cargo.toml
          make schema-rs
          cargo clippy --manifest-path lkr/codemode/wasm/Cargo.toml -- -D warnings
          cargo test --manifest-path lkr/codemode/wasm/Cargo.toml
          make codemode-wasm
          cd add-ons/codemode-extension && npm install --no-audit --no-fund && npx tsc --noEmit && npm run build

      - name: Run pytest
        run: |
          uv run pytest tests/ -v
          uv run pytest tests/test_schema.py -v --cov=lkr.schema --cov=scripts.schema --cov-report=term-missing

      - name: Run ruff
        run: |
          uv run ruff check .

      - name: Run ty
        run: |
          uv run ty check

      - name: Get short SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Upload Code Mode WASM bundles to GCS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: dist
          destination: "${{ secrets.CDN_BUCKET_NAME }}/cli/codemode/${{ steps.vars.outputs.short_sha }}"
          parent: false
          process_gcloudignore: false

      - name: Add CDN links to Job Summary and Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="### 🚀 Code Mode WASM Deployed to CDN (Commit \`${{ steps.vars.outputs.short_sha }}\`)"$'\n\n'
          for file in dist/*.js; do
            filename=$(basename "$file")
            url="https://cdn.lkr.dev/cli/codemode/${{ steps.vars.outputs.short_sha }}/$filename"
            BODY+="- **$filename**: [\`$url\`]($url)"$'\n'
          done
          echo "$BODY" >> $GITHUB_STEP_SUMMARY
          gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY"
